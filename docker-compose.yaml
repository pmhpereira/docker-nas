# originally from https://github.com/jimmybish/qnap-docker-compose/

services:
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    environment:
      - PUID=1000
      - PGID=0
      - TZ=Europe/Lisbon
      - WEBUI_PORT=8080
      - TORRENTING_PORT=6881
    volumes:
      - /share/Container/qbittorrent:/config
      - /share/Downloads/Torrent:/downloads
    ports:
      - 8080:8080
      - 6881:6881
      - 6881:6881/udp
    restart: unless-stopped
    networks:
      qnet-static:
        ipv4_address: 192.168.1.1
  
  radarr:
    image: ghcr.io/linuxserver/radarr
    container_name: radarr
    environment:
      - PUID=1000
      - PGID=0
      - TZ=Europe/Lisbon
    volumes:
      - /share/Container/radarr:/config
      - /share/Multimedia/Movies:/movies
      - /share/Downloads/Torrent/completed/Movies:/downloads
    ports:
      - 7878:7878
    restart: unless-stopped
    networks:
      qnet-static:
        ipv4_address: 192.168.1.2

  sonarr:
    image: ghcr.io/linuxserver/sonarr
    container_name: sonarr
    environment:
      - PUID=1000
      - PGID=0
      - TZ=Europe/Lisbon
    volumes:
      - /share/Container/sonarr:/config
      - /share/Multimedia/TV:/tv
      - /share/Downloads/Torrent/completed/TV:/downloads
    ports:
      - 8989:8989
    restart: unless-stopped
    networks:
      qnet-static:
        ipv4_address: 192.168.1.3

  plex:
    image: ghcr.io/linuxserver/plex
    container_name: plex
    environment:
      - VERSION=docker
    volumes:
      - /share/Container/plex:/config
      - /share/Multimedia/TV:/tv
      - /share/Multimedia/Movies:/movies
      - /share/Multimedia/Photos:/photos
      - /share/Backups/plex_db:/db_backups
    devices:
      - /dev/dri:/dev/dri
    restart: unless-stopped
    networks:
      qnet-static:
        ipv4_address: 192.168.1.4

  portainer:
    image: portainer/portainer-ce:lts
    container_name: portainer
    command: -H unix:///var/run/docker.sock
    environment:
      - TZ=Europe/Lisbon
      - VIRTUAL_HOST=portainer.dudezord.dev
      - VIRTUAL_PORT=9000
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /share/Container/portainer:/data
    ports:
      - 9443:9443
      - 8000:8000  # Remove if you do not intend to use Edge Agents
    restart: always
    networks:
      qnet-static:
        ipv4_address: 192.168.1.5

  homeassistant:
    image: "ghcr.io/home-assistant/home-assistant:stable"
    container_name: homeassistant
    environment:
      - TZ=Europe/Lisbon
    volumes:
      - /share/Container/homeassistant:/config
      - /etc/localtime:/etc/localtime:ro
      - /run/dbus:/run/dbus:ro
    restart: unless-stopped
    privileged: true
    networks:
      qnet-static:
        ipv4_address: 192.168.1.6

  adguardhome:
    image: adguard/adguardhome
    container_name: adguardhome
    volumes:
      - /share/Container/adguardhome/workdir:/opt/adguardhome/work
      - /share/Container/adguardhome/confdir:/opt/adguardhome/conf
    restart: unless-stopped
    networks:
      qnet-static:
        ipv4_address: 192.168.1.7

  nginx-proxy-manager:
    image: 'docker.io/jc21/nginx-proxy-manager:latest'
    container_name: nginx-proxy-manager
    volumes:
      - /share/Container/nginx-proxy-manager/data:/data
      - /share/Container/nginx-proxy-manager/letsencrypt:/etc/letsencrypt
      - /share/Container/nginx-proxy-manager/tmp:/tmp
    ports:
      - 80:80
      - 81:81
      - 443:443
    restart: unless-stopped
    networks:
      qnet-static:
        ipv4_address: 192.168.1.8

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    environment:
      - PUID=1000
      - PGID=0
      - TZ=Europe/Lisbon
    volumes:
      - /share/Container/prowlarr/data:/config
    ports:
      - 9696:9696
    restart: unless-stopped
    networks:
      qnet-static:
        ipv4_address: 192.168.1.9

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    environment:
      - PUID=1000
      - PGID=0
      - LOG_LEVEL=info
      - LOG_HTML=false
      - CAPTCHA_SOLVER=none
      - TZ=Europe/Lisbon
    volumes:
      - /share/Container/flaresolverr:/config
    ports:
      - 8191:8191
    restart: unless-stopped
    networks:
      qnet-static:
        ipv4_address: 192.168.1.10
        
networks:
  qnet-static:
    driver: qnet
    driver_opts:
      iface: "eth1"
    ipam:
      driver: qnet
      options:
        iface: "eth1"
      config:
        - subnet: 192.168.1.0/24
          gateway: 192.168.1.254

# Set DNS to 1.1.1.1 and 8.8.8.8 manually